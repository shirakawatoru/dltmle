[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dltmle"
version = "0.0.12"
requires-python = ">=3.11"
description = "Deep LTMLE: Longitudinal Targeted Minimum Loss-based Estimation with Temporal-Difference Heterogenous-Token Transformer"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=4.0.0",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

